<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfajores BBB - Panel Maestro de Sorteo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #1a0f1d; color: #fff8f0; }
    .bg-chocolate { background-color: #2A1810; }
    .bg-caramel { background-color: #C67D33; }
    .card-gradient { background: linear-gradient(135deg, #3B2219 0%, #2A1810 100%); }
    .glow-effect { box-shadow: 0 0 25px rgba(198, 125, 51, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-5xl mx-auto w-full">

  <!-- Header Maestro -->
  <header class="flex justify-between items-center border-b border-amber-500/30 pb-4 mb-6">
    <div>
      <span class="bg-purple-500/20 text-purple-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-purple-500/30">
        Panel Maestro Exclusivo
      </span>
      <h1 class="text-3xl font-black text-amber-100 mt-1">Control de Sorteo en Vivo</h1>
    </div>

    <button onclick="triggerRaffle()" class="bg-gradient-to-r from-amber-500 to-caramel text-chocolate font-black px-6 py-3 rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition flex items-center gap-2">
      <span>🎁</span> REALIZAR SORTEO
    </button>
  </header>

  <main class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1">
    
    <!-- Lista de Participantes Conectados -->
    <div class="card-gradient p-5 rounded-2xl border border-white/10 space-y-3 flex flex-col">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-amber-200 text-sm">Participantes Conectados</h3>
        <span class="text-xs bg-black/40 px-2 py-1 rounded text-amber-300 font-mono" id="participant-counter">0 Participantes</span>
      </div>
      <p class="text-[11px] text-amber-100/60">Lista sincronizada automáticamente con la app de los invitados.</p>
      
      <div class="space-y-2 flex-1 max-h-[400px] overflow-y-auto pr-1" id="participants-list"></div>
    </div>

    <!-- Pantalla Principal del Sorteo -->
    <div class="md:col-span-2 card-gradient border-2 border-caramel/40 rounded-3xl p-6 flex flex-col items-center justify-center text-center space-y-4 glow-effect relative overflow-hidden">
      <h3 class="text-lg font-bold text-amber-300 uppercase tracking-widest">Resultado del Sorteo</h3>

      <div id="raffle-box" class="w-full max-w-md bg-black/50 border border-white/10 p-8 rounded-2xl flex flex-col items-center space-y-3 min-h-[200px] justify-center">
        <span class="text-5xl">🎰</span>
        <p class="text-amber-100/70 text-sm">Presiona "REALIZAR SORTEO" para elegir un ganador entre los chicos que escanearon sus alfajores.</p>
      </div>
    </div>

  </main>

  <script>
    function loadParticipants() {
      // Carga los participantes almacenados en tiempo real
      let defaultParticipants = [
        { id: 'Camila Rossi', name: 'Camila Rossi', count: 3 },
        { id: 'Lucas Benítez', name: 'Lucas Benítez', count: 4 },
        { id: 'Sofía Martínez', name: 'Sofía Martínez', count: 2 }
      ];

      let stored = JSON.parse(localStorage.getItem('bbb_participants') || '[]');
      let combined = [...defaultParticipants, ...stored];

      // Eliminar duplicados
      let uniqueParticipants = Array.from(new Map(combined.map(item => [item.id, item])).values());
      
      renderParticipants(uniqueParticipants);
      return uniqueParticipants;
    }

    function removeParticipant(index) {
      let participants = loadParticipants();
      participants.splice(index, 1);
      localStorage.setItem('bbb_participants', JSON.stringify(participants));
      renderParticipants(participants);
    }

    function renderParticipants(listData) {
      const list = document.getElementById('participants-list');
      list.innerHTML = '';

      document.getElementById('participant-counter').innerText = `${listData.length} Participantes`;

      listData.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = "p-2.5 rounded-xl bg-black/40 border border-white/5 flex justify-between items-center text-xs";
        
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="${p.count > 0 ? 'text-emerald-400' : 'text-gray-500'} font-bold">●</span>
            <span class="font-bold text-amber-100">${p.name} <span class="text-[10px] text-amber-400 font-normal">(${p.count}/4)</span></span>
          </div>
          <button onclick="removeParticipant(${index})" class="bg-red-500/20 hover:bg-red-500/40 text-red-300 px-2 py-1 rounded border border-red-500/30 transition text-[10px]">
            ❌ Quitar
          </button>
        `;
        list.appendChild(item);
      });
    }

    function triggerRaffle() {
      const raffleBox = document.getElementById('raffle-box');
      const activeParticipants = loadParticipants().filter(p => p.count > 0);

      if (activeParticipants.length === 0) {
        raffleBox.innerHTML = `<p class="text-red-400 font-bold text-sm">No hay participantes válidos para sortear.</p>`;
        return;
      }

      let counter = 0;
      const interval = setInterval(() => {
        const randomP = activeParticipants[Math.floor(Math.random() * activeParticipants.length)];
        raffleBox.innerHTML = `
          <span class="text-4xl animate-bounce">🎁</span>
          <p class="text-xs text-amber-400 uppercase tracking-widest font-bold">Sorteando en vivo...</p>
          <h4 class="text-2xl font-black text-amber-200">${randomP.name}</h4>
        `;
        counter++;
        if (counter > 15) {
          clearInterval(interval);
          const winner = activeParticipants[Math.floor(Math.random() * activeParticipants.length)];
          raffleBox.innerHTML = `
            <div class="space-y-2">
              <span class="text-5xl">🏆</span>
              <p class="text-xs text-emerald-400 font-bold uppercase tracking-widest">¡Ganador/a del Sorteo!</p>
              <h4 class="text-3xl font-black text-amber-200">${winner.name}</h4>
            </div>
          `;
        }
      }, 100);
    }

    // Auto-actualización continua para sincronizar cuando entren nuevos chicos
    setInterval(loadParticipants, 3000);
    window.addEventListener('load', loadParticipants);
  </script>
</body>
</html>
